name: Diagnose lowercase plate routes

on:
  push:
    branches: [ "inspect/prod-layout" ]

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Test lowercase production endpoints
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEV_HOST }}
          username: ${{ secrets.DEV_USER }}
          key: ${{ secrets.DEV_SSH_KEY }}
          script_stop: false
          command_timeout: 3m
          script: |
            TMP=$(mktemp)
            trap 'rm -f "$TMP"' EXIT

            request() {
              LABEL="$1"
              URL="$2"
              echo "=== $LABEL ==="
              CODE=$(curl --max-time 25 -sS -o "$TMP" -w '%{http_code}' -H "Host: www.hulpveren.shop" "$URL" || true)
              echo "HTTP=$CODE"
              echo "BYTES=$(wc -c < "$TMP")"
              head -c 8000 "$TMP"; echo
            }

            request "BACKEND API LOWERCASE" "http://127.0.0.1:3004/api/plate/l948vt"
            request "BACKEND ALDOC LOWERCASE" "http://127.0.0.1:3004/aldoc-proxy/partservices/l948vt"

            echo "=== NGINX FOLLOW API ==="
            CODE=$(curl --max-time 25 -k -L --resolve www.hulpveren.shop:443:127.0.0.1 -sS -o "$TMP" -w '%{http_code}' "https://www.hulpveren.shop/api/plate/L948VT" || true)
            echo "HTTP=$CODE BYTES=$(wc -c < "$TMP")"
            head -c 5000 "$TMP"; echo

            echo "=== NGINX FOLLOW ALDOC ==="
            CODE=$(curl --max-time 25 -k -L --resolve www.hulpveren.shop:443:127.0.0.1 -sS -o "$TMP" -w '%{http_code}' "https://www.hulpveren.shop/aldoc-proxy/PartServices/L948VT" || true)
            echo "HTTP=$CODE BYTES=$(wc -c < "$TMP")"
            head -c 12000 "$TMP"; echo

            echo "=== CANDIDATE SKU FIELDS ==="
            python3 - "$TMP" <<'PY' || true
import json, sys, re
p=sys.argv[1]
try:
    d=json.load(open(p))
except Exception as e:
    print("JSON_ERROR", e)
    raise SystemExit
seen=set()
def walk(x,path=""):
    if isinstance(x,dict):
        for k,v in x.items():
            kp=f"{path}.{k}" if path else k
            kl=k.lower()
            if any(s in kl for s in ("part","article","product","brand","supplier","sku","item","code","number")):
                sv=str(v)
                if len(sv)<600:
                    item=(kp,sv)
                    if item not in seen:
                        seen.add(item); print(kp,"=",sv)
            walk(v,kp)
    elif isinstance(x,list):
        for i,v in enumerate(x):
            walk(v,f"{path}[{i}]")
walk(d)
PY

            echo "=== CANONICAL LOWERCASE MIDDLEWARE SEARCH ==="
            grep -RInE 'toLowerCase\(\)|lowercase|301|redirect\(' /opt/apps/backend/server --include='*.js' 2>/dev/null | head -n 160 || true
