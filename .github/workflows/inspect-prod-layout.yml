name: Diagnose lowercase plate routes

on:
  push:
    branches: [ "inspect/prod-layout" ]

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Test lowercase production endpoints
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEV_HOST }}
          username: ${{ secrets.DEV_USER }}
          key: ${{ secrets.DEV_SSH_KEY }}
          script_stop: false
          command_timeout: 3m
          script: |
            TMP=$(mktemp)

            echo "=== BACKEND API LOWERCASE ==="
            CODE=$(curl --max-time 25 -sS -o "$TMP" -w '%{http_code}' -H "Host: www.hulpveren.shop" "http://127.0.0.1:3004/api/plate/l948vt" || true)
            echo "HTTP=$CODE BYTES=$(wc -c < "$TMP")"
            head -c 8000 "$TMP"; echo

            echo "=== BACKEND ALDOC LOWERCASE ==="
            CODE=$(curl --max-time 25 -sS -o "$TMP" -w '%{http_code}' -H "Host: www.hulpveren.shop" "http://127.0.0.1:3004/aldoc-proxy/partservices/l948vt" || true)
            echo "HTTP=$CODE BYTES=$(wc -c < "$TMP")"
            head -c 16000 "$TMP"; echo

            echo "=== NGINX FOLLOW API ==="
            CODE=$(curl --max-time 25 -k -L --resolve www.hulpveren.shop:443:127.0.0.1 -sS -o "$TMP" -w '%{http_code}' "https://www.hulpveren.shop/api/plate/L948VT" || true)
            echo "HTTP=$CODE BYTES=$(wc -c < "$TMP")"
            head -c 8000 "$TMP"; echo

            echo "=== NGINX FOLLOW ALDOC ==="
            CODE=$(curl --max-time 25 -k -L --resolve www.hulpveren.shop:443:127.0.0.1 -sS -o "$TMP" -w '%{http_code}' "https://www.hulpveren.shop/aldoc-proxy/PartServices/L948VT" || true)
            echo "HTTP=$CODE BYTES=$(wc -c < "$TMP")"
            head -c 16000 "$TMP"; echo

            echo "=== RAW TOKENS ==="
            grep -oE '[0-9]{4,}' "$TMP" | sort -u | head -n 100 || true
            grep -oEi '.{0,70}(MAD|hulpveren|auxiliary|product|article|part|brand|supplier).{0,120}' "$TMP" | head -n 100 || true

            echo "=== LOWERCASE REDIRECT CODE ==="
            grep -RInE 'toLowerCase\(\)|lowercase|redirect\(' /opt/apps/backend/server --include='*.js' 2>/dev/null | head -n 160 || true

            rm -f "$TMP"
