name: Diagnose production routing

on:
  push:
    branches: [ "inspect/prod-layout" ]

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Compare nginx and backend routes
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEV_HOST }}
          username: ${{ secrets.DEV_USER }}
          key: ${{ secrets.DEV_SSH_KEY }}
          script_stop: false
          command_timeout: 3m
          script: |
            TMP=$(mktemp)
            echo "=== NGINX API HEADERS ==="
            curl --max-time 15 -k --resolve www.hulpveren.shop:443:127.0.0.1 -sS -D - -o "$TMP" "https://www.hulpveren.shop/api/plate/L948VT" || true
            echo "-- body"; head -c 500 "$TMP"; echo

            echo "=== NGINX ALDOC HEADERS ==="
            curl --max-time 15 -k --resolve www.hulpveren.shop:443:127.0.0.1 -sS -D - -o "$TMP" "https://www.hulpveren.shop/aldoc-proxy/PartServices/L948VT" || true
            echo "-- body"; head -c 1000 "$TMP"; echo

            echo "=== BACKEND API 3004 ==="
            curl --max-time 20 -sS -D - -o "$TMP" -H "Host: www.hulpveren.shop" "http://127.0.0.1:3004/api/plate/L948VT" || true
            echo "-- body"; head -c 2000 "$TMP"; echo

            echo "=== BACKEND ALDOC 3004 ==="
            curl --max-time 20 -sS -D - -o "$TMP" -H "Host: www.hulpveren.shop" "http://127.0.0.1:3004/aldoc-proxy/PartServices/L948VT" || true
            echo "-- bytes $(wc -c < "$TMP")"
            echo "-- body"; head -c 5000 "$TMP"; echo

            echo "=== BACKEND PAGE 3004 ==="
            curl --max-time 20 -sS -D - -o "$TMP" -H "Host: www.hulpveren.shop" "http://127.0.0.1:3004/hulpveren/volkswagen/touran/touran-1t/?kt=L948VT" || true
            echo "-- body"; head -c 1000 "$TMP"; echo

            echo "=== BACKEND SERVICE ==="
            systemctl status lowland-api.service --no-pager -l 2>/dev/null | head -n 60 || true
            echo "=== RECENT BACKEND LOG ==="
            journalctl -u lowland-api.service -n 80 --no-pager 2>/dev/null || true

            rm -f "$TMP"
