name: Verify production Touran plate fix

on:
  push:
    branches: [ "inspect/prod-layout" ]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect live Aldoc response
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEV_HOST }}
          username: ${{ secrets.DEV_USER }}
          key: ${{ secrets.DEV_SSH_KEY }}
          script_stop: false
          command_timeout: 5m
          script: |
            LIVE=/var/www/hulpveren-live-site/public
            APP="$LIVE/assets/js/app.js"
            ALDOC=$(mktemp)
            PLATE=$(mktemp)

            echo "=== LIVE FILE STATE ==="
            grep -q 'function getPlateFromQuery' "$APP" && echo QUERY_FIX_PRESENT || echo QUERY_FIX_ABSENT
            grep -q 'ensureAldocSetsOnKtRoute("renderer-ready")' "$APP" && echo DIRECT_ALDOC_FIX_PRESENT || echo DIRECT_ALDOC_FIX_ABSENT
            grep -q 'aldocSetsCheckedAt' "$APP" && echo EMPTY_RESULT_GUARD_PRESENT || echo EMPTY_RESULT_GUARD_ABSENT
            node --check "$APP" && echo LIVE_SYNTAX_OK || echo LIVE_SYNTAX_FAILED

            echo "=== LIVE HTTP ==="
            curl -k --resolve www.hulpveren.shop:443:127.0.0.1 -sS -o /dev/null -w 'PAGE_HTTP=%{http_code}\n' "https://www.hulpveren.shop/hulpveren/volkswagen/touran/touran-1t/?kt=L948VT"
            curl -k --resolve www.hulpveren.shop:443:127.0.0.1 -sS -o /dev/null -w 'APP_HTTP=%{http_code}\n' "https://www.hulpveren.shop/assets/js/app.js?v=$(date +%s)"

            echo "=== ALDOC RESPONSE ==="
            curl -k --resolve www.hulpveren.shop:443:127.0.0.1 -sS -o "$ALDOC" -w 'ALDOC_HTTP=%{http_code}\n' "https://www.hulpveren.shop/aldoc-proxy/PartServices/L948VT"
            echo "ALDOC_BYTES=$(wc -c < "$ALDOC")"
            python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); print("ALDOC_TYPE="+type(d).__name__); print("ALDOC_TOP_KEYS="+(",".join(d.keys()) if isinstance(d,dict) else "")); print("ALDOC_SAMPLE="+json.dumps(d,ensure_ascii=False)[:5000])' "$ALDOC" || true
            echo "ALDOC_6DIGIT_TOKENS:"
            grep -oE '[0-9]{6}' "$ALDOC" | sort -u || true
            echo "ALDOC_MAD_TOKENS:"
            grep -oEi '.{0,80}(MAD|hulpveren|auxiliary|1031|204).{0,120}' "$ALDOC" | head -n 40 || true

            echo "=== PLATE API ==="
            curl -k --resolve www.hulpveren.shop:443:127.0.0.1 -sS -o "$PLATE" -w 'PLATE_API_HTTP=%{http_code}\n' "https://www.hulpveren.shop/api/plate/L948VT"
            echo "PLATE_BYTES=$(wc -c < "$PLATE")"
            python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); print("PLATE_SAMPLE="+json.dumps(d,ensure_ascii=False)[:3000])' "$PLATE" || true

            rm -f "$ALDOC" "$PLATE"
