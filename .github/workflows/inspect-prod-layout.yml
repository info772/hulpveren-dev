name: Quick lowercase endpoint check

on:
  push:
    branches: [ "inspect/prod-layout" ]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check lowercase backend endpoints
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEV_HOST }}
          username: ${{ secrets.DEV_USER }}
          key: ${{ secrets.DEV_SSH_KEY }}
          script_stop: false
          command_timeout: 1m
          script: |
            TMP=$(mktemp)
            echo "=== API LOWER ==="
            curl --max-time 8 -sS -D /tmp/hdr-api -o "$TMP" -H "Host: www.hulpveren.shop" "http://127.0.0.1:3004/api/plate/l948vt" || true
            cat /tmp/hdr-api 2>/dev/null || true
            echo "BYTES=$(wc -c < "$TMP")"
            head -c 6000 "$TMP"; echo

            echo "=== ALDOC LOWER ==="
            : > "$TMP"
            curl --max-time 8 -sS -D /tmp/hdr-aldoc -o "$TMP" -H "Host: www.hulpveren.shop" "http://127.0.0.1:3004/aldoc-proxy/partservices/l948vt" || true
            cat /tmp/hdr-aldoc 2>/dev/null || true
            echo "BYTES=$(wc -c < "$TMP")"
            head -c 12000 "$TMP"; echo

            echo "=== TOKENS ==="
            grep -oE '[0-9]{4,}' "$TMP" | sort -u | head -n 100 || true
            grep -oEi '.{0,80}(MAD|hulpveren|auxiliary|product|article|part|brand|supplier).{0,120}' "$TMP" | head -n 100 || true
            rm -f "$TMP" /tmp/hdr-api /tmp/hdr-aldoc
