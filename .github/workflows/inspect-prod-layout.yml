name: Inspect production layout

on:
  push:
    branches: [ "inspect/prod-layout" ]

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect production source read-only
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEV_HOST }}
          username: ${{ secrets.DEV_USER }}
          key: ${{ secrets.DEV_SSH_KEY }}
          script_stop: true
          command_timeout: 5m
          script: |
            set -u
            PROD=/var/www/hulpveren-live-site
            echo "=== PROD ROOT ==="
            readlink -f "$PROD" || true
            ls -la "$PROD" || true

            echo "=== PROD GIT ==="
            if git -C "$PROD" rev-parse --is-inside-work-tree >/dev/null 2>&1; then
              git -C "$PROD" status -sb || true
              echo "-- branch"
              git -C "$PROD" branch --show-current || true
              echo "-- head"
              git -C "$PROD" rev-parse HEAD || true
              echo "-- remotes"
              git -C "$PROD" remote -v || true
              echo "-- latest"
              git -C "$PROD" log -1 --oneline || true
            else
              echo "NOT_A_GIT_REPO"
            fi

            echo "=== PROD APP MARKERS ==="
            APP="$PROD/public/assets/js/app.js"
            stat "$APP" || true
            grep -n 'function getPlateFromQuery' "$APP" || true
            grep -n 'renderer-ready' "$APP" || true
            grep -n 'alreadyAppliedAldocSets' "$APP" || true

            echo "=== BUILD/DEPLOY MARKERS ==="
            for f in "$PROD/public/assets/build-id.txt" "$PROD/public/.deploy.txt" "$PROD/.deploy.txt"; do
              if [ -f "$f" ]; then
                echo "--- $f"
                cat "$f" || true
              fi
            done

            echo "=== PROD NGINX BLOCK ==="
            nginx -T 2>&1 | sed -n '/configuration file \/etc\/nginx\/sites-enabled\/hulpveren.shop:/,/configuration file /p' || true

            echo "=== DEPLOY SCRIPTS ==="
            find /usr/local/bin /home/ivor /opt/apps -maxdepth 5 -type f -iname '*deploy*' -print 2>/dev/null | sort || true

            echo "=== HULPVEREN PATHS ==="
            find /home/ivor /opt/apps -maxdepth 5 -type d -iname '*hulpveren*' -print 2>/dev/null | sort || true

            echo "=== PORT 3004 ==="
            ss -ltnp 2>/dev/null | grep ':3004' || true
            systemctl list-units --type=service --all --no-pager 2>/dev/null | grep -Ei 'hulpveren|lowland' || true
