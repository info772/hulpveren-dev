name: Inspect production patch compatibility

on:
  push:
    branches: [ "inspect/prod-layout" ]

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Dry-run live app patch
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEV_HOST }}
          username: ${{ secrets.DEV_USER }}
          key: ${{ secrets.DEV_SSH_KEY }}
          script_stop: false
          command_timeout: 5m
          script: |
            SRC=/home/ivor/deploy-src/repo/hulpveren-dev
            LIVE=/var/www/hulpveren-live-site/public
            BASE=5d9f6a95ff6a9e9d7f03ad4b5869b841ade30df1
            FIX=41de77474e2eb69342bd49d8aff9c320247a7142
            TMP=$(mktemp)
            trap 'rm -f "$TMP"' EXIT

            echo "=== SOURCE STATE ==="
            git -C "$SRC" rev-parse HEAD 2>&1 || true
            git -C "$SRC" status -sb 2>&1 || true

            echo "=== HASHES ==="
            sha256sum "$LIVE/assets/js/app.js" 2>/dev/null || true
            git -C "$SRC" show "$BASE:wwwroot/assets/js/app.js" | sha256sum || true
            git -C "$SRC" show "$FIX:wwwroot/assets/js/app.js" | sha256sum || true

            echo "=== PATCH SIZE ==="
            git -C "$SRC" diff --numstat "$BASE" "$FIX" -- wwwroot/assets/js/app.js || true

            git -C "$SRC" diff --no-ext-diff "$BASE" "$FIX" -- wwwroot/assets/js/app.js \
              | sed 's#a/wwwroot/assets/js/app.js#a/assets/js/app.js#; s#b/wwwroot/assets/js/app.js#b/assets/js/app.js#' > "$TMP"

            echo "=== DRY RUN EXACT ==="
            cd "$LIVE"
            if patch --dry-run --batch --fuzz=0 -p1 < "$TMP"; then
              echo PATCH_DRY_RUN_OK
            else
              echo PATCH_DRY_RUN_FAILED
            fi

            echo "=== CURRENT LIVE SYNTAX ==="
            if node --check "$LIVE/assets/js/app.js"; then echo LIVE_SYNTAX_OK; else echo LIVE_SYNTAX_FAILED; fi

            echo "=== RELEVANT LIVE CONTEXT ==="
            grep -n -E 'hasPlateToken|isPlateRoutePath|aldocSetsApplied|applyAldocSetsPayloadToPage|isKtPlateRoute|alreadyAppliedAldocSets|const route = parseRoute' "$LIVE/assets/js/app.js" 2>/dev/null || true
